<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Страница не найдена</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: url('assets/img/404.png') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            position: relative;
            color: #fff;
            overflow-x: hidden;
        }

        @media (min-width: 992px) {
            .error-container {
                position: absolute;
                top: 20%;
                right: 15%;
            }
        }

        @media (max-width: 991px) {
            body {
                background-attachment: scroll;
            }
            
            .error-container {
                background: rgba(0, 0, 0, 0.04);
                backdrop-filter: blur(5px);
                border-radius: 20px;
                margin-top: -80px;
            }
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center">
    <main class="container-fluid h-100 d-flex align-items-center justify-content-center">
        <div class="error-container text-center">
            <h1 class="display-1 fw-bold mb-2 text-primary-emphasis">404</h1>
            <h2 class="h3 fw-normal text-muted mb-4">Страница не найдена</h2>
            <p class="lead mb-4 text-secondary">
                Возможно, страница была перемещена или временно недоступна.
            </p>
            <div class="d-flex justify-content-center gap-3 mb-4">
                <a href="index.html" class="btn btn-primary px-4 py-2">
                    <i class="bi bi-house me-2"></i>На главную
                </a>
                <a href="schedule.html" class="btn btn-outline-secondary px-4 py-2">
                    Расписание занятий
                </a>
            </div>
        </div>
    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
